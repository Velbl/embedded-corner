cbuild-run:
  generated-by: csolution version 2.13.0+p3-g40b6564e
  solution: ../Lesson.csolution.yml
  target-type: STM32C0316-DK
  target-set: default
  compiler: AC6
  device: STMicroelectronics::STM32C031C6Tx
  device-pack: Keil::STM32C0xx_DFP@2.4.0
  output:
    - file: Lesson/STM32C0316-DK/Debug/Lesson.axf
      info: generate by Lesson.Debug+STM32C0316-DK
      type: elf
      load: symbols
    - file: Lesson/STM32C0316-DK/Debug/Lesson.hex
      info: generate by Lesson.Debug+STM32C0316-DK
      type: hex
      load: image
  system-resources:
    memory:
      - name: Flash
        access: rx
        start: 0x08000000
        size: 0x00008000
        from-pack: Keil::STM32C0xx_DFP@2.4.0
      - name: SRAM
        access: rwx
        start: 0x20000000
        size: 0x00003000
        from-pack: Keil::STM32C0xx_DFP@2.4.0
  system-descriptions:
    - file: ${CMSIS_PACK_ROOT}/Keil/STM32C0xx_DFP/2.4.0/CMSIS/SVD/STM32C031.svd
      type: svd
  debugger:
    name: ST-Link@pyOCD
    protocol: swd
    clock: 4000000
    dbgconf: ../.cmsis/Lesson+STM32C0316-DK.dbgconf
    gdbserver:
      - port: 3333
  debug-vars:
    vars: |
      // Default values for variables in debug sequences are configured with a *.dbgconf file in the user project
      __var DbgMCU_CR        = 0x00000006;   // DBGMCU_CR:       DBGMCU configuration register
      __var DbgMCU_APB_Fz1   = 0x00201803;   // DBGMCU_APB_FZ1:  DBGMCU APB freeze register 1
      __var DbgMCU_APB_Fz2   = 0x00078800;   // DBGMCU_APB_FZ2:  DBGMCU APB freeze register 2
  debug-sequences:
    - name: DebugDeviceUnlock
      blocks:
        - execute: |
            Sequence("CheckID");
    - name: DebugCoreStart
      blocks:
        - execute: |
            // Replication of Standard Functionality
            Write32(0xE000EDF0, 0xA05F0001);                                        // Enable Core Debug via DHCSR
        - info: DbgMCU registers
          execute: |
            // Device Specific Debug Setup
            Write32(0x4002103C, Read32(0x4002103C) | 0x08000000);                   // Set RCC_APBENR1.DBGEN

            Write32(0x40015804, DbgMCU_CR);                                         // DBGMCU_CR: Configure MCU Debug
            Write32(0x40015808, DbgMCU_APB_Fz1);                                    // DBGMCU_APB_FZ1: Configure APB Freeze Behavior
            Write32(0x4001580C, DbgMCU_APB_Fz2);                                    // DBGMCU_APB_FZ2: Configure APB Freeze Behavior
    - name: CheckID
      blocks:
        - execute: |
            __var pidr1 = 0;
            __var pidr2 = 0;
            __var jep106id = 0;
            __var ROMTableBase = 0;

            __ap = 0;      // AHB-AP

            ROMTableBase = ReadAP(0xF8) & ~0x3;

            pidr1 = Read32(ROMTableBase + 0x0FE4);
            pidr2 = Read32(ROMTableBase + 0x0FE8);
            jep106id = ((pidr2 & 0x7) << 4 ) | ((pidr1 >> 4) & 0xF);
        - if: jep106id != 0x20
          execute: |
            Query(0, "Not a genuine ST Device! Abort connection", 1);
            Message(2, "Not a genuine ST Device! Abort connection.");
  programming:
    - algorithm: ${CMSIS_PACK_ROOT}/Keil/STM32C0xx_DFP/2.4.0/CMSIS/Flash/STM32C0x_32.FLM
      start: 0x08000000
      size: 0x00008000
      ram-start: 0x20000000
      ram-size: 0x00003000
